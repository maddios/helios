name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run depcheck
      - run: npx prettier --check sdk .github docs/guides
      - run: npm run build -w sdk
      - run: npm run test:dist -w sdk
      - run: npm run check:examples -w sdk
