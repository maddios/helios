name: sdk-publish

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build -w sdk
      - run: npm run test:dist -w sdk
      - run: npx jest sdk
      - run: npm run check:examples -w sdk
      - name: Check the tag matches the SDK version
        run: test "${GITHUB_REF_NAME#sdk-v}" = "$(node -p "require('./sdk/package.json').version")"
      - run: npm publish -w sdk --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
