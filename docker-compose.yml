# Default: local/config.json points at the shared localstack (:4566) and mongodb (:27017, rs0).
# Isolated infra: `docker compose --profile standalone up -d`, then point local/config.json at 4666 / 27117.
services:
  localstack:
    image: localstack/localstack:4.14
    profiles: ["standalone"]
    ports:
      - "4666:4566"
    environment:
      SERVICES: s3,sqs,events
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    profiles: ["standalone"]
    ports:
      - "27117:27017"
  helios-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: test
    init: true
    network_mode: host
    volumes:
      - ./local:/app/local:ro
    command: ["npx", "tsx", "local/runWorker.ts"]
  helios-openai-mock:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: test
    init: true
    network_mode: host
    volumes:
      - ./local:/app/local:ro
    command: ["npx", "tsx", "local/openaiMock.ts"]
  helios-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: test
    init: true
    network_mode: host
    volumes:
      - ./local:/app/local:ro
    command: ["npx", "tsx", "local/runApi.ts"]
  helios-lambdas:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: test
    init: true
    network_mode: host
    volumes:
      - ./local:/app/local:ro
    command: ["npx", "tsx", "local/lambdaRunner.ts"]
  helios-img:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: test
    init: true
    network_mode: host
    volumes:
      - ./local:/app/local:ro
    command: ["npx", "tsx", "local/imageEdge.ts"]
